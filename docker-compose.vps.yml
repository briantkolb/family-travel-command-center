services:
  travel-reference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-command-center-reference
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_INTERNAL_PORT: 3001
      HOST: 0.0.0.0
      APP_INTERNAL_HOST: 127.0.0.1
      DATA_DIR: /data
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - travel-reference-state:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  travel-reference-state:
